name: CI
on:
  push:
    branches-ignore: ['all-contributors/**']
  pull_request:
    branches-ignore: ['all-contributors/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - id: restore
        name: ♻️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            yarn.lock
            node_modules
          key: ${{ hashFiles('package.json') }}
          restore-keys: ${{ hashFiles('package.json') }}-

      - id: install
        if: >
          steps.restore.outputs.cache-matched-key == ''
        name: 📥 Install deps
        run: yarn
        env:
          HUSKY_SKIP_INSTALL: true
      - if: >
          steps.install.outcome == 'success'
        name: ♻️ Save node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            yarn.lock
            node_modules
          key: ${{ hashFiles('package.json') }}-${{ hashFiles('yarn.lock') }}

      - name: ✍ Lint
        run: npm run lint
      - name: 🧪 Test
        run: npm run test -- --coverage
      - name: 🚧 Build test environments
        run: npm run setup:env
      - name: 🔬 Test with toolbox
        run: npm run test:toolbox
      - name: 🏗 Build
        run: npm run build

      - name: ☂️ Upload coverage report
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC)
    if: >
      github.event_name == 'push' &&
      github.repository == 'testing-library/user-event' &&
      contains('refs/heads/main,refs/heads/beta,refs/heads/alpha', github.ref) &&
      vars.RELEASE_DRY != 'true'
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          # semantic-release needs full history + tags to see unreleased commits
          fetch-depth: 0
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ♻️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            yarn.lock
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: 📥 Install deps
        run: yarn
        env:
          HUSKY_SKIP_INSTALL: true

      - name: 🏗️ Run build script
        run: npm run build

      # JS action (not Docker) so GitHub OIDC works with npm trusted publishing
      - name: 🚀 Release
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 25
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Backfill npm when a git tag/GitHub release exists but npm publish was skipped
      - name: 📦 Ensure latest tag is on npm
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION=${TAG#v}
          if npm view "@testing-library/user-event@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has ${VERSION}"
            exit 0
          fi
          echo "Publishing missing ${VERSION} to npm"
          npm install -g npm@latest
          npm version "${VERSION}" --no-git-tag-version
          npm publish --access public
